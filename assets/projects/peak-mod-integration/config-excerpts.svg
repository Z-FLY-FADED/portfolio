<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PEAK 模组整合包配置摘录</title>
  <desc id="desc">多人插件配置 MaxPlayers 为 20，翻译插件目标语言为 zh，启用 UGUI 和 TextMeshPro。</desc>
  <rect width="1200" height="520" fill="#edf0f4"/>
  <g fill="#23354f" font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <text x="55" y="61" font-size="18" letter-spacing="2" fill="#465b78">PEAK / CONFIGURATION</text>
    <text x="55" y="119" font-size="41" font-weight="600">多人房间与中文界面配置</text>
    <path d="M55 145h1090M55 486h1090M597 183v270" fill="none" stroke="#b7c5d8"/>
    <g font-size="21" fill="#465b78">
      <text x="55" y="219">01 / 多人插件</text><text x="645" y="219">02 / 翻译插件</text>
    </g>
    <g font-family="Consolas, Liberation Mono, monospace">
      <text x="55" y="263" font-size="23">PeakUnlimited.cfg</text>
      <text x="645" y="263" font-size="23">AutoTranslatorConfig.ini</text>
      <g font-size="27">
        <text x="55" y="328">MaxPlayers = <tspan fill="#2354b0">20</tspan></text>
        <text x="55" y="377">ExtraMarshmallows = <tspan fill="#2354b0">true</tspan></text>
        <text x="645" y="328">Language=<tspan fill="#2354b0">zh</tspan></text>
        <text x="645" y="377">EnableUGUI=<tspan fill="#2354b0">True</tspan></text>
        <text x="645" y="426">EnableTextMeshPro=<tspan fill="#2354b0">True</tspan></text>
      </g>
    </g>
  </g>
</svg>
