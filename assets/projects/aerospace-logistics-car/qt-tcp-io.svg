<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 610" role="img" aria-labelledby="title desc">
<title id="title">上位机与车端的双向数据流</title>
<desc id="desc">Qt 上位机经 TCP 向车端发送运动指令，接收并显示车辆状态和传感器数据。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#3763a7" stroke-width="1.5"/></marker></defs>
<rect width="1240" height="610" fill="#edf1f7"/>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif">
<text x="55" y="55" font-size="19" fill="#536b88" font-weight="400">航天智慧物流智能车</text>
<text x="55" y="116" font-size="38" fill="#263851" font-weight="600">上位机与车端的双向数据流</text>
<path d="M55 143h1130" stroke="#b8c8dc"/>
<text x="75" y="208" font-size="29" fill="#263851" font-weight="600">Qt 上位机</text>
<text x="879" y="208" font-size="29" fill="#263851" font-weight="600">车端下位机</text>
<path d="M306 181v334M855 181v334M55 361h1130M55 529h1130" stroke="#bdcce0" fill="none"/>
<text x="75" y="289" font-size="24" fill="#263851" font-weight="400">交互与指令生成</text>
<text x="878" y="289" font-size="24" fill="#263851" font-weight="400">接收运动指令</text>
<path d="M331 309h493" stroke="#3763a7" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="428" y="285" font-size="23" fill="#315797" font-weight="400">运动指令下发 / TCP</text>
<text x="75" y="451" font-size="24" fill="#263851" font-weight="400">数据解析与可视化</text>
<text x="878" y="451" font-size="24" fill="#263851" font-weight="400">设备状态与传感器</text>
<path d="M824 471H331" stroke="#3763a7" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="428" y="447" font-size="23" fill="#315797" font-weight="400">状态与传感数据回传</text>
<text x="55" y="578" font-size="18" fill="#536b88" font-weight="400">依据简历中记载的项目工作绘制</text>
</g></svg>